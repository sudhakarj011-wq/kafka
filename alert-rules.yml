groups:
  - name: banking-alerts
    rules:
      - alert: PaymentServiceDown
        expr: up{job="payment-service"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Payment Service is DOWN!"
          description: "Payment Service (host.docker.internal:8082) has been down for more than 30 seconds."

      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[1m]) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate detected"
          description: "Error rate across services has exceeded 5% within the last minute."
