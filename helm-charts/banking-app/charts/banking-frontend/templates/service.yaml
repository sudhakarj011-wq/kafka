apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-banking-frontend
  labels:
    app: banking-frontend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
  selector:
    app: banking-frontend
