apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-audit-service
  labels:
    app: audit-service
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
  selector:
    app: audit-service

