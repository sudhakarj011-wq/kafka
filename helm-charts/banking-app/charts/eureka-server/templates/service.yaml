apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-eureka-server
  labels:
    app: eureka-server
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
  selector:
    app: eureka-server

