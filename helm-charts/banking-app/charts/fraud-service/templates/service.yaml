apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-fraud-service
  labels:
    app: fraud-service
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
  selector:
    app: fraud-service

