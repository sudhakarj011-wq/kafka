server:
  port: 8761

spring:
  application:
    name: eureka-server

# ============================================================
# Eureka Server Configuration
#
# INTERVIEW TIP:
# Q: What is Eureka and why do we need it?
# A: In microservices, services can run on ANY host/port, and
#    they scale up/down dynamically. Hardcoding URLs like
#    "http://account-service:8081" is brittle.
#
#    Eureka is a Service Registry — a phone book for services:
#    - Services REGISTER themselves on startup
#    - API Gateway and other services DISCOVER URLs from Eureka
#    - If a service goes down, Eureka removes it after heartbeat fails
#
#    Example:
#    Account Service starts → registers as "account-service"
#    Payment Service's OpenFeign calls "account-service"
#    → Feign asks Eureka: "Where is account-service?"
#    → Eureka: "http://192.168.1.100:8081"
#    → Feign calls that URL
#
# Q: What happens if Eureka goes down?
# A: Services cache the registry locally. They continue working
#    with the last known registry for a short time.
# ============================================================
eureka:
  instance:
    hostname: localhost
  client:
    # Eureka server does NOT register itself
    register-with-eureka: false
    # Eureka server does NOT fetch its own registry
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Wait time before purging dead instances
    eviction-interval-timer-in-ms: 5000
    # Disable self-preservation in dev (enables quick cleanup of dead instances)
    # In production, keep this true to avoid evicting services during network blip
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
