server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: account-service
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # Pull configuration from Centralized Config Server
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  datasource:
    url: jdbc:mysql://localhost:3306/account_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpassword}  # Matches docker-compose.yml MYSQL_ROOT_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: account-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      # PRODUCTION SAFE: 'validate' checks schema matches entities, but never alters tables.
      # Use 'update' only in local dev. Use 'none' in cloud/K8s (managed by Flyway/Liquibase).
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Actuator & Tracing
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:4318/v1/traces

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.banking: DEBUG
    org.hibernate.SQL: DEBUG

# ──────────────────────────────────────────────────────────────────────
# gRPC Server Configuration
#
# INTERVIEW TIP — Why separate port (9090)?
# - gRPC uses Netty HTTP/2 server, Spring Boot uses Tomcat HTTP/1.1
# - They are two separate servers started in the SAME JVM
# - REST API stays on port 8081 (unchanged — frontend still works)
# - gRPC runs on port 9090 (internal service-to-service only)
# - In Kubernetes: only port 8081 needs to be exposed via Ingress/Service
#   Port 9090 can be ClusterIP (internal only) for security
#
# grpc.server.port=-1 → disables gRPC (useful in test profiles)
# ──────────────────────────────────────────────────────────────────────
grpc:
  server:
    port: 9090
