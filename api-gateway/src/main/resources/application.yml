server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # Pull configuration from Centralized Config Server
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  # Redis configuration for Rate Limiting (RequestRateLimiter filter uses Redis)
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  # ============================================================
  # Spring Cloud Gateway — Route Configuration
  #
  # HOW ROUTING WORKS:
  # Request: POST http://localhost:8080/api/payments/transfer
  #    1. Gateway receives request
  #    2. JWT Filter: validates Bearer token in Authorization header
  #    3. Route match: /api/payments/** → payment-service
  #    4. Gateway resolves "lb://payment-service" via Eureka
  #    5. Forwards to: http://192.168.1.x:8082/api/payments/transfer
  #
  # lb:// = Load Balanced. Gateway uses Ribbon/LoadBalancer
  # to distribute requests among multiple instances of a service.
  #
  # INTERVIEW TIP:
  # Q: Why use an API Gateway?
  # A: 1. Single entry point — Angular only needs ONE URL
  #    2. Cross-cutting concerns in ONE place:
  #       - JWT validation (not repeated in every service)
  #       - Rate limiting, circuit breaker
  #       - Logging, monitoring
  #       - CORS for all services
  #    3. Hide internal service topology from clients
  #    4. Load balancing across service instances
  # ============================================================
  cloud:
    gateway:
      # Global CORS — Angular can call the Gateway from any origin
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:4200"
              - "http://localhost:4201"
              - "http://127.0.0.1:4200"
              - "http://127.0.0.1:4201"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        # ── Auth Service (Login/Register — PUBLIC, NO JWT filter) ────
        # MUST be FIRST — before account-service route which has JwtAuthFilter
        - id: auth-login
          uri: lb://account-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}

        # ── Account Register (PUBLIC — NO JWT filter) ─────────────────
        - id: account-register
          uri: lb://account-service
          predicates:
            - Path=/api/v1/accounts/register
            - Method=POST
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}

        # ── Account Service (JWT PROTECTED + Rate Limited) ──────────────────────────
        - id: account-service
          uri: lb://account-service          # Eureka service discovery
          predicates:
            - Path=/api/v1/accounts/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}
            - name: JwtAuthFilter            # Custom JWT validation filter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # ── Payment Service (JWT PROTECTED + Strict Rate Limiting + Idempotent) ─────
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}
            - name: JwtAuthFilter
            - name: IdempotencyFilter        # Prevents double-charging (Gap 5)
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # ── Notification Service ─────────────────────────────────
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}
            - name: JwtAuthFilter

        # ── Analytics Service ────────────────────────────────────
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}
            - name: JwtAuthFilter

        # ── Eureka Dashboard (for monitoring) ────────────────────
        - id: eureka-dashboard
          uri: http://localhost:8761
          predicates:
            - Path=/eureka/**

# Eureka client — gateway registers itself and discovers services
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# JWT Configuration
# SECURITY: Secret is loaded from environment variable (set in .env or Docker/Kubernetes secrets)
# NEVER hardcode secrets in application.yml or commit to Git!
jwt:
  secret: ${JWT_SECRET:banking-payment-system-super-secret-key-2026-do-not-share-in-production}
  expiration: ${JWT_EXPIRATION:86400000}

# Public paths — these bypass JWT filter (updated to match v1 routes)
gateway:
  public-paths:
    - /api/v1/auth/login
    - /api/v1/auth/register
    - /api/v1/accounts/register
    - /actuator/health
    - /eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.banking: DEBUG
