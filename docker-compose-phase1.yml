version: '3.8'

# ============================================================
# PHASE 1 - Docker Compose: MySQL only
# Run: docker compose -f docker-compose-phase1.yml up -d
# ============================================================
# In later phases, we add Kafka, Zookeeper, Kafka UI, and
# all microservices to a single docker-compose.yml
# ============================================================

services:

  # ──────────────── MySQL Database ────────────────
  mysql:
    image: mysql:8.0
    container_name: banking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: bankinguser
      MYSQL_PASSWORD: banking123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local

networks:
  banking-network:
    driver: bridge
    name: banking-network
