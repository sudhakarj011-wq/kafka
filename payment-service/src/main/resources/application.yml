server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: payment-service
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # Pull configuration from Centralized Config Server
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  datasource:
    url: jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpassword}  # Matches docker-compose.yml MYSQL_ROOT_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # PRODUCTION SAFE: 'validate' checks schema matches entities, but never alters tables.
      # Use 'update' only in local dev. Use 'none' in cloud/K8s (managed by Flyway/Liquibase).
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ──────────────────────────────────────────────────────────────
  # Kafka Producer Configuration
  #
  # INTERVIEW TIP:
  # Q: What serializers does Kafka use?
  # A: Key → StringSerializer (transactionId is a String)
  #    Value → JsonSerializer (PaymentEvent is a Java object → JSON)
  #
  # acks=all → Producer waits for ALL replica leaders to acknowledge
  #            before considering message sent. Prevents data loss.
  #
  # retries=3 → If broker is temporarily unavailable, retry 3 times.
  # ──────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
        max.in.flight.requests.per.connection: 1  # Preserve ordering within partition

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# ──────────────────────────────────────────────────────────────
# Account Service URL
# In Phase 3 (Eureka), this will be replaced by service name:
#   http://account-service
# Feign will resolve it via Eureka automatically.
# For Phase 2 (no Eureka), we use direct URL.
# ──────────────────────────────────────────────────────────────
account-service:
  url: http://localhost:8081

# Kafka Topic
kafka:
  topic:
    payment-events: payment-events

# Actuator & Tracing
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0 # 100% traces for local dev
  zipkin:
    tracing:
      endpoint: http://localhost:4318/v1/traces  # Jaeger OTLP HTTP endpoint

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.banking: DEBUG
    org.apache.kafka: WARN

# ──────────────────────────────────────────────────────────────
# Resilience4j Circuit Breaker
# ──────────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      accountGrpcClient:
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3

# ──────────────────────────────────────────────────────────────
# Razorpay Payment Gateway Configuration
# key-id and key-secret: from Razorpay Dashboard → Settings → API Keys
# Use TEST keys for development (prefix: rzp_test_)
# Use LIVE keys for production (prefix: rzp_live_)
# ──────────────────────────────────────────────────────────────
razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_xxxxxxxxxxxxxxxxxx}
  key-secret: ${RAZORPAY_KEY_SECRET:xxxxxxxxxxxxxxxxxxxxxxxx}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:your_webhook_secret_here}
