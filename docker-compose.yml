version: '3.8'

services:
  # ==========================================
  # INFRASTRUCTURE
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - banking-net

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - banking-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - banking-net

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - banking-net

  # ==========================================
  # PLATFORM SERVICES
  # ==========================================
  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    networks:
      - banking-net

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - banking-net

  # ==========================================
  # MICROSERVICES
  # ==========================================
  account-service:
    build: ./account-service
    ports:
      - "8081:8081"
    depends_on:
      - mysql
      - eureka-server
    environment:
      - MYSQL_HOST=mysql
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - banking-net

  payment-service:
    build: ./payment-service
    ports:
      - "8082:8082"
    depends_on:
      - mysql
      - kafka
      - eureka-server
    environment:
      - MYSQL_HOST=mysql
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - banking-net

  notification-service:
    build: ./notification-service
    ports:
      - "8083:8083"
    depends_on:
      - mysql
      - kafka
      - eureka-server
    environment:
      - MYSQL_HOST=mysql
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - banking-net

  fraud-service:
    build: ./fraud-service
    ports:
      - "8084:8084"
    depends_on:
      - mysql
      - kafka
      - eureka-server
    environment:
      - MYSQL_HOST=mysql
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - banking-net

  audit-service:
    build: ./audit-service
    ports:
      - "8085:8085"
    depends_on:
      - mysql
      - kafka
      - eureka-server
    environment:
      - MYSQL_HOST=mysql
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - banking-net

  analytics-service:
    build: ./analytics-service
    ports:
      - "8086:8086"
    depends_on:
      - mysql
      - kafka
      - eureka-server
    environment:
      - MYSQL_HOST=mysql
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - banking-net

  # ==========================================
  # FRONTEND
  # ==========================================
  banking-frontend:
    build: ./banking-frontend
    ports:
      - "4200:80"
    networks:
      - banking-net

networks:
  banking-net:
    driver: bridge
